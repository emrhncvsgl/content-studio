<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stüdyo Editörü</title>
  <style>
    :root { --bg: #121212; --panel: #1b1b1d; --line: #2c2c30; --text: #e8e6e1; --dim: #9a978f; --accent: #f9d509; --sel: #3a3420; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #root { height: 100%; }
    button, select { font: inherit; color: inherit; background: #26262a; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: #555; }
    h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #2a2a2e; color: var(--text); font-size: 12px; margin: 2px 4px 2px 0; }
    .tag.y { background: var(--accent); color: #111; }
    .muted { color: var(--dim); }
    code { background: #222; padding: 0 4px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/__app.js"></script>
</body>
</html>
