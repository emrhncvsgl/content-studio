# Ana seri sesi (EN), EP003'ten itibaren. Kaynak: tur 2 testinde en beğenilen trial_H7 (DECISIONS 2026-10-25, 2026-10-27).
id: narrator_v3
description: "Qwen3-TTS VoiceDesign H_calm_authority (seed 7): male narrator in his fifties, low-medium pitch (~132 Hz), smooth voice without rasp, calm authoritative documentary tone, measured pace. Synthetic designed voice, not a real person."
refs:
