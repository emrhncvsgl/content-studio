# style: auto iken konu tipine göre öneri (PLAN 7.2). Görsel yönetmen sahne bazında uygular.
auto_rules:
  - { topic: "soyut ilke/kavram",                   styles: [blueprint-diagram, kinetic-type] }
  - { topic: "buluş hikâyesi, vaka analizi",        styles: [ken-burns-photo, archival-film] }
  - { topic: "karşılaştırma (önce/sonra, sorun/çözüm)", styles: [split-screen] }
  - { topic: "sayı, istatistik, patent verisi",     styles: [data-viz] }
  - { topic: "seri tanıtımı",                       styles: [trading-card] }
  - { topic: "sosyal/konuşmalı anlatım",            styles: [chat-ui] }
  - { topic: "karma konu",                          styles: [hybrid] }
# style_mode: lang_neutral iken yalnızca lang_neutral: true (veya partial) stiller seçilir (PLAN 10).
