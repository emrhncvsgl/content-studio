# Stil kataloğu (PLAN Ek A'nın makine okunur hali). Kanaldan bağımsız.
# kind: code = görsel Remotion'da React/SVG ile çizilir · photo = lisanslı fotoğraf/arşiv görseli · type = tipografi ağırlıklı · mixed
# lang_neutral: true = ekrana dile bağlı yazı basmaz (MLA için uygun) · partial = sayı/simge basar · false = dil bağımlı yazı basar
# difficulty: K (kolay) / O (orta) / Z (zor) — Remotion yapım zorluğu
# implemented: studio/src/styles/<id>/ altında bileşen var mı (Faz 2+ ile güncellenir)
# mix_with: aynı videoda (sahneler arası) ya da aynı sahnede (öğe ödünç alarak) uyumlu karışan stiller. guide: ajan uygulama talimatı (kurallar, adımlar, tarif JSON'ları) · learn: kullanıcı için öğretici anlatım

