doc: 'Görsel dilin eksenleri (kullanıcı 2026-11-11: ''stil ne teknik ne ayırt edemiyorum''). styles.yaml''daki her kayıt burada bir eksene oturur: looks = görünüş (kare neye benziyor; made_with: hangi tekniklerle
  yapılabilir), technique_styles = aslında üretim yolu olan kayıtlar, edit_patterns = kurgu/düzen kalıpları. Görünüş ile teknik ayrı eksen: ağaç baskı görünüşü 3D teknikle yapılabilir. Katman çerçevesi:
  studio/editor/layers.ts. Yeni stil eklenince buraya da yazılır.'
techniques:
  2d-collage:
    tr: 2D katmanlı kolaj
    what: kesilmiş kâğıt/fotoğraf parçaları sanal bir masada, derinlik düzlemleri ve sanal kamera
    built: true
    via: vox-explainer
  photo-motion:
    tr: Fotoğraf hareketi
    what: durağan görsel üzerinde yakınlaşma/kayma (Ken Burns)
    built: true
    via: ken-burns-photo, archival-film
  2.5d-planes:
    tr: 2 katmanlı 2.5D
    what: ön nesne kesilir, arkası doldurulur; iki katman farklı hızda kayar
    built: true
    via: tools/photo_planes.py
  2.5d-depth:
    tr: Derinlik haritalı çok katmanlı 2.5D
    what: derinlik haritasıyla 3-4 kart; tek ana nesnesi olmayan manzara/gravür
    built: true
    via: depth-photo
  3d-scan:
    tr: Gerçek 3D tarama
    what: müzenin 3D taraması sanal ışık ve kamerayla
    built: true
    via: object3d
  3d-code:
    tr: Kodla kurulan 3D sahne
    what: nesneler, mekanizma ve mekân kodla (three.js); kamera dünyada gezer (cinecode yaklaşımı)
    built: true
    via: woodcut sahneleri (kit.tsx)
  shader-print:
    tr: Baskı/çizim dönüştürücü (shader)
    what: 3D ya da fotoğraf karesini baskı, gravür, boya görünüşüne çevirir
    built: true
    via: woodcut (kit.tsx), Lemo motoru
  canvas-strokes:
    tr: Kodla fırça/kesik çizimi
    what: her çizgi/fırça darbesi ayrı çizilir ve kendini çizer (Lemo motoru)
    built: true
    via: woodcut/lemo
  vector-draw:
    tr: Kodla vektör çizim
    what: SVG/vektör şekiller, çizgiler kendini çizer
    built: true
    via: blueprint-diagram
  math-anim:
    tr: Matematik/fizik animasyonu
    what: Manim ile denklemler, kuvvetler, grafikler
    built: true
    via: manim
  typography:
    tr: Tipografi animasyonu
    what: yazının kendisi hareket eder
    built: true
    via: kinetic-type
  footage:
    tr: Video görüntüsü
    what: gerçek film/video kaydı
    built: true
    via: footage
  lighting-sim:
    tr: Işık/gölge simülasyonu
    what: arkadan aydınlatılmış kâğıt, gölge, ışık kutusu
    built: true
    via: lantern
